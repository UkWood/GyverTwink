; Сборка прошивки GyverTwink через PlatformIO
;   pio run                 - собрать все окружения
;   pio run -e d1_mini      - только одно
;   pio run -e d1_mini -t upload
;
; Исходники лежат в папке скетча Arduino (несколько .ino-вкладок).
; FastLED подтягивается из реестра (lib_deps), остальные библиотеки лежат в libraries/:
; EEManager и SimplePortal изменены в этом проекте, EncButton 1.x несовместим с актуальными версиями.
;
; Ядро Arduino ESP8266: по умолчанию 2.7.x (платформа espressif8266@2.6.3). Проверено на плате: на ядре 3.x гирлянда даёт короткие яркие
; вспышки при работе эффектов, а после выключения из веб-интерфейса остаются гореть первые светодиоды (немаскируемые прерывания WiFi
; портят тайминг вывода FastLED; в самом драйвере FastLED есть комментарий про мерцание первого пикселя с ядра 3.0.0).
; На ядре 2.7.x этого нет. Окружение d1_mini_core3 (ядро 3.x) остаётся только для проверки, что код собирается и на новом ядре.

[platformio]
src_dir = firmware/GyverTwink_v1.2
default_envs = d1_mini

[env]
platform = espressif8266@2.6.3
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_extra_dirs = libraries
lib_ldf_mode = chain+
; FastLED закреплён на 3.5.0: код вызывает strip->showLeds()/clearLedData() напрямую, а в 3.9.0 эти методы CLEDController
; недоступны (проверено в CI). Чтобы перейти на новее, нужно переписать вывод на FastLED.show().
lib_deps =
  fastled/FastLED@3.5.0

[env:d1_mini]
board = d1_mini

[env:nodemcuv2]
board = nodemcuv2

; ядро Arduino ESP8266 3.x: только проверка сборки, на плате даёт вспышки и зависшие светодиоды (см. выше)
[env:d1_mini_core3]
platform = espressif8266@4.2.1
board = d1_mini
