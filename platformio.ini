; Сборка прошивки GyverTwink через PlatformIO
;   pio run                 - собрать все окружения
;   pio run -e d1_mini      - только одно
;   pio run -e d1_mini -t upload
;
; Исходники лежат в папке скетча Arduino (несколько .ino-вкладок).
; FastLED подтягивается из реестра (lib_deps), остальные библиотеки лежат в libraries/:
; EEManager и SimplePortal изменены в этом проекте, EncButton 1.x несовместим с актуальными версиями.

[platformio]
src_dir = firmware/GyverTwink_v1.2
default_envs = d1_mini

[env]
platform = espressif8266@4.2.1
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_extra_dirs = libraries
lib_ldf_mode = chain+
lib_deps =
  fastled/FastLED@3.5.0

[env:d1_mini]
board = d1_mini

[env:nodemcuv2]
board = nodemcuv2

; ядро Arduino ESP8266 2.7.x - на нём проект писался (проверка совместимости)
[env:d1_mini_legacy]
platform = espressif8266@2.6.3
board = d1_mini
