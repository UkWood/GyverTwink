name: Build firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [d1_mini, nodemcuv2, d1_mini_core3]   # d1_mini и nodemcuv2 - ядро 2.7.x (для платы), d1_mini_core3 - ядро 3.x (только проверка сборки)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ matrix.env }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run -e ${{ matrix.env }} 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0

      - name: Размер прошивки (должна помещаться в раздел OTA, около 1 МБ)
        run: |
          size=$(stat -c%s .pio/build/${{ matrix.env }}/firmware.bin)
          echo "firmware.bin: $size байт"
          test "$size" -lt 921600

      - name: Размеры и ОЗУ (в сводку запуска)
        run: |
          limit=921600
          size=$(stat -c%s .pio/build/${{ matrix.env }}/firmware.bin)
          ram=$(grep -m1 'RAM:' build.log || true)
          flash=$(grep -m1 'Flash:' build.log || true)
          used=$(echo "$ram" | sed -n 's/.*used \([0-9]*\) bytes.*/\1/p')
          total=$(echo "$ram" | sed -n 's/.*from \([0-9]*\) bytes.*/\1/p')
          {
            echo "### ${{ matrix.env }}"
            echo
            echo "| Показатель | Значение |"
            echo "|---|---|"
            echo "| firmware.bin | $size Б ($((size / 1024)) КБ) |"
            echo "| Лимит OTA (CI) | $limit Б ($((limit / 1024)) КБ) |"
            echo "| Запас до лимита | $((limit - size)) Б ($(((limit - size) / 1024)) КБ) |"
            if [ -n "$used" ] && [ -n "$total" ]; then
              echo "| Статическая ОЗУ (data+bss) | $used из $total Б ($((used / 1024)) КБ) |"
              echo "| Остаётся под кучу и стек (оценка) | $((total - used)) Б ($(((total - used) / 1024)) КБ) |"
            fi
            echo
            echo '```'
            echo "$ram"
            echo "$flash"
            sz=$(ls ~/.platformio/packages/toolchain-xtensa*/bin/xtensa-lx106-elf-size 2>/dev/null | head -1)
            if [ -n "$sz" ]; then
              "$sz" -A .pio/build/${{ matrix.env }}/firmware.elf | grep -E '^(section|\.(text|data|rodata|bss|irom0\.text))\b' || true
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/firmware.bin

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # зависание (например, бесконечный цикл в коде прошивки) не должно держать CI
    steps:
      - uses: actions/checkout@v4
      - name: Host tests (g++, AddressSanitizer + UBSan)
        run: make -C tests
      - name: Android-вариант скетча приложения соответствует исходнику (python3 tools/make_android_sketch.py, если нет)
        run: python3 tools/make_android_sketch.py --check

  protocol-stand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Protocol stand (Python client with ACK/retries against the real firmware code, lossy UDP)
        run: make -C tests stand

  web-page:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: web_page.h соответствует исходникам web/ (запусти tools/gen_web.py, если нет)
        run: python3 tools/gen_web.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Синтаксис app.js
        run: node --check web/app.js
      - name: Тесты чистых функций страницы
        run: node --test web/test/geometry.test.mjs web/test/calib.test.mjs web/test/schedule.test.mjs

  web-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Зеркало пакетов Ubuntu на раннерах иногда отдаёт файлы с паузами по десятки секунд (apt занимал 15+ минут).
      # Поэтому apt не используется: Chromium качается с CDN Playwright без --with-deps (системные библиотеки на раннере уже есть,
      # недостающие шрифты тесту не нужны - он проверяет DOM), ffmpeg и numpy берутся из PyPI. У шагов есть тайм-ауты и повтор.
      - name: Playwright и Chromium
        timeout-minutes: 10
        run: |
          npm install --prefix tests/web
          for i in 1 2 3; do
            timeout 180 npx --prefix tests/web playwright install chromium && break
            echo "попытка $i не удалась"; test $i -lt 3 || exit 1
          done
      - name: ffmpeg и numpy (синтетическое видео для теста калибровки)
        timeout-minutes: 5
        run: |
          pip install numpy imageio-ffmpeg
          mkdir -p "$HOME/bin"
          ln -sf "$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$HOME/bin/ffmpeg"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/ffmpeg" -version | head -1
      - name: Хост-сервер с настоящим кодом прошивки
        run: make -C tests gt_host
      - name: e2e-тест веб-интерфейса
        run: node tests/web/ui_test.mjs ./tests/gt_host

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Android SDK уже есть на раннере (ANDROID_HOME); Gradle ставим нужной версии, wrapper (бинарный jar) в репозитории не храним
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Тесты логики оболочки и сборка APK (release, подпись ключом проекта)
        working-directory: android
        run: gradle --console=plain :core:test :app:assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gyvertwink-app
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
