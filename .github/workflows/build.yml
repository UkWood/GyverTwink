name: Build firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [d1_mini, nodemcuv2, d1_mini_legacy]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ matrix.env }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run -e ${{ matrix.env }}

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/firmware.bin

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # зависание (например, бесконечный цикл в коде прошивки) не должно держать CI
    steps:
      - uses: actions/checkout@v4
      - name: Host tests (g++, AddressSanitizer + UBSan)
        run: make -C tests

  protocol-stand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Protocol stand (Python client with ACK/retries against the real firmware code, lossy UDP)
        run: make -C tests stand

  web-page:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: web_page.h соответствует исходникам web/ (запусти tools/gen_web.py, если нет)
        run: python3 tools/gen_web.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Синтаксис app.js
        run: node --check web/app.js
      - name: Тесты чистых функций страницы
        run: node --test web/test/geometry.test.mjs web/test/calib.test.mjs

  web-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright и Chromium
        run: |
          npm install --prefix tests/web
          npx --prefix tests/web playwright install --with-deps chromium
      - name: ffmpeg и numpy (синтетическое видео для теста калибровки)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-numpy
      - name: Хост-сервер с настоящим кодом прошивки
        run: make -C tests gt_host
      - name: e2e-тест веб-интерфейса
        run: node tests/web/ui_test.mjs ./tests/gt_host
