# Одноразовая миграция: опубликовать APK из репозитория как релиз GitHub (Actions -> Publish APK -> Run workflow).
# После публикации APK удаляется из дерева репозитория, а этот файл - вместе с ним.
name: Publish APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например app-v1.7"
        required: true
      title:
        description: "Название релиза"
        required: true
      notes:
        description: "Описание релиза"
        required: false
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release with the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: |
          test -f Android/gyvertwink.apk
          gh release create "$TAG" Android/gyvertwink.apk --title "$TITLE" --notes "${NOTES:-Android-приложение GyverTwink}"
